<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: head('Vehiculos')}"></head>

<body>
    <nav th:replace="~{fragmentos :: nav('vehiculos')}"></nav>

    <main>
        <h1>Vehiculos</h1>

        <div th:replace="~{fragmentos :: mensajes}"></div>

        <div class="columnas">
            <div class="caja">
                <h2 th:text="${vehiculo.idVehiculo == null} ? 'Nuevo vehiculo' : 'Editar vehiculo #' + ${vehiculo.idVehiculo}">Nuevo vehiculo</h2>
                <form th:action="${vehiculo.idVehiculo == null} ? @{/vehiculos/guardar} : @{/vehiculos/{id}/actualizar(id=${vehiculo.idVehiculo})}" method="post">
                    <div class="dos">
                        <div class="campo">
                            <label for="marca">Marca</label>
                            <input type="text" id="marca" name="marca" th:value="${vehiculo.marca}" placeholder="nissan" required>
                        </div>
                        <div class="campo">
                            <label for="modelo">Modelo</label>
                            <input type="text" id="modelo" name="modelo" th:value="${vehiculo.modelo}" placeholder="versa" required>
                        </div>
                    </div>
                    <div class="dos">
                        <div class="campo">
                            <label for="anio">Anio</label>
                            <input type="number" id="anio" name="anio" th:value="${vehiculo.anio}" placeholder="2019" required>
                        </div>
                        <div class="campo">
                            <label for="tarifaDiaria">Tarifa / dia</label>
                            <input type="number" id="tarifaDiaria" name="tarifaDiaria" th:value="${vehiculo.tarifaDiaria}" step="0.01" min="1" placeholder="650" required>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="matricula">Matricula</label>
                        <input type="text" id="matricula" name="matricula" th:value="${vehiculo.matricula}" placeholder="YKP-12-34" required>
                    </div>
                    <div class="campo">
                        <label for="oficina">Oficina</label>
                        <select id="oficina" name="oficina.idOficina" required>
                            <option value="">-- elige una --</option>
                            <option th:each="o : ${oficinas}" th:value="${o.idOficina}" th:text="${o.nombre}"
                                th:selected="${vehiculo.oficina != null and vehiculo.oficina.idOficina == o.idOficina}"></option>
                        </select>
                    </div>
                    <button type="submit" class="boton" th:text="${vehiculo.idVehiculo == null} ? 'Guardar vehiculo' : 'Guardar cambios'">Guardar vehiculo</button>
                    <a class="cancelar" th:if="${vehiculo.idVehiculo != null}" th:href="@{/vehiculos}">Cancelar</a>
                </form>
            </div>

            <div class="caja tabla">
                <h2 th:text="'Registrados (' + ${#lists.size(vehiculos)} + ')'">Registrados</h2>
                <div class="vacio" th:if="${#lists.isEmpty(vehiculos)}">Todavia no hay vehiculos.</div>
                <table th:unless="${#lists.isEmpty(vehiculos)}">
                    <tr>
                        <th>Matricula</th>
                        <th>Vehiculo</th>
                        <th>Oficina</th>
                        <th>Tarifa</th>
                        <th>Estado</th>
                        <th></th>
                    </tr>
                    <tr th:each="v : ${vehiculos}" th:classappend="${v.idVehiculo == vehiculo.idVehiculo} ? 'editando'">
                        <td class="mono" th:text="${v.matricula}"></td>
                        <td th:text="${v.marca} + ' ' + ${v.modelo} + ' ' + ${v.anio}"></td>
                        <td th:text="${v.oficina != null} ? ${v.oficina.nombre} : '-'"></td>
                        <td class="mono" th:text="'$' + ${v.tarifaDiaria}"></td>
                        <td><span class="estado" th:classappend="${v.estado}" th:text="${v.estado}"></span></td>
                        <td class="acciones">
                            <a class="boton-chico" th:href="@{/vehiculos/{id}/editar(id=${v.idVehiculo})}">Editar</a>
                            <form th:action="@{/vehiculos/{id}/eliminar(id=${v.idVehiculo})}" method="post">
                                <button type="submit" class="boton-chico">Borrar</button>
                            </form>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
