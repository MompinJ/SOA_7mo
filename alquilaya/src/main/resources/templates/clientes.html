<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: head('Clientes')}"></head>

<body>
    <nav th:replace="~{fragmentos :: nav('clientes')}"></nav>

    <main>
        <h1>Clientes</h1>

        <div th:replace="~{fragmentos :: mensajes}"></div>

        <div class="columnas">
            <div class="caja">
                <h2 th:text="${cliente.idCliente == null} ? 'Nuevo cliente' : 'Editar cliente #' + ${cliente.idCliente}">Nuevo cliente</h2>
                <form th:action="${cliente.idCliente == null} ? @{/clientes/guardar} : @{/clientes/{id}/actualizar(id=${cliente.idCliente})}" method="post">
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" th:value="${cliente.nombre}" required>
                    </div>
                    <div class="campo">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" th:value="${cliente.apellido}" required>
                    </div>
                    <div class="campo">
                        <label for="email">Correo</label>
                        <input type="email" id="email" name="email" th:value="${cliente.email}" placeholder="alguien@ucc.mx" required>
                    </div>
                    <div class="dos">
                        <div class="campo">
                            <label for="licenciaConducir">Licencia</label>
                            <input type="text" id="licenciaConducir" name="licenciaConducir" th:value="${cliente.licenciaConducir}" required>
                        </div>
                        <div class="campo">
                            <label for="telefono">Telefono</label>
                            <input type="text" id="telefono" name="telefono" th:value="${cliente.telefono}">
                        </div>
                    </div>
                    <button type="submit" class="boton" th:text="${cliente.idCliente == null} ? 'Guardar cliente' : 'Guardar cambios'">Guardar cliente</button>
                    <a class="cancelar" th:if="${cliente.idCliente != null}" th:href="@{/clientes}">Cancelar</a>
                </form>
            </div>

            <div class="caja tabla">
                <h2 th:text="'Registrados (' + ${#lists.size(clientes)} + ')'">Registrados</h2>
                <div class="vacio" th:if="${#lists.isEmpty(clientes)}">Todavia no hay clientes.</div>
                <table th:unless="${#lists.isEmpty(clientes)}">
                    <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Licencia</th>
                        <th>Telefono</th>
                        <th></th>
                    </tr>
                    <tr th:each="c : ${clientes}" th:classappend="${c.idCliente == cliente.idCliente} ? 'editando'">
                        <td th:text="${c.nombre} + ' ' + ${c.apellido}"></td>
                        <td th:text="${c.email}"></td>
                        <td class="mono" th:text="${c.licenciaConducir}"></td>
                        <td th:text="${c.telefono}"></td>
                        <td class="acciones">
                            <a class="boton-chico" th:href="@{/clientes/{id}/editar(id=${c.idCliente})}">Editar</a>
                            <form th:action="@{/clientes/{id}/eliminar(id=${c.idCliente})}" method="post">
                                <button type="submit" class="boton-chico">Borrar</button>
                            </form>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
