spring.application.name=alquilaya
spring.config.import=optional:file:.env[.properties]

server.port=8282

spring.datasource.url=jdbc:mysql://localhost:3307/alquilaya_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.mvc.format.date=iso
server.servlet.session.tracking-modes=cookie
